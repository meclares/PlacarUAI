<body>

<p class="lb">Forma de uso</p><div id="sMode"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="./supabase-client-config.js"></script>
<script src="./auth-storage.js"></script>
<script>
var KEY='placaruai.v1',HKEY='placaruai.hist.v1';
var PKEY='placaruai.profile.v1', AKEY='placaruai.account.v1', RKEY='placaruai.accounts.v1', LKEY='placaruai.athlete.matches.v1', FBKEY='placaruai.profile.feedback.v1', TKEY='placaruai.tournaments.v1';
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
(function removeLegacyCredentials(){
  var accounts=ld(RKEY,[]),changed=false;
  if(Array.isArray(accounts))accounts.forEach(function(account){
    if(account&&typeof account==='object'&&Object.prototype.hasOwnProperty.call(account,'proof')){
      delete account.proof;changed=true;
    }
  });
  if(changed)sv(RKEY,accounts);
  try{localStorage.removeItem(AKEY)}catch(error){console.error('Unable to clear legacy local account',error)}
  try{sessionStorage.removeItem('placaruai.master')}catch(error){console.error('Unable to clear legacy master session',error)}
})();
var T=function(n){return{name:n,pts:0,games:0,sets:0,y:0,r:0}};
var S=ld(KEY,null)||{mod:'volei',mode:'toque',flip:false,theme:null,A:T('Dupla A'),B:T('Dupla B')};
S.tb=!!S.tb;S.mtb=!!S.mtb;S.done=!!S.done;S.win=S.win||null;S.alert=S.alert||'';S.cfg=S.cfg||{fmt:'set6',nad:true};S.cfg.vp=S.cfg.vp||{volei:21,futevolei:18};S.undo=S.undo||[];S.hs=S.hs||[];S.A.games=S.A.games||0;S.B.games=S.B.games||0;
var NAMES={volei:'Vôlei',futevolei:'Futevôlei',beach:'Beach tennis'};
function save(){sv(KEY,S)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function personName(value){return String(value||'').trim().toLocaleLowerCase('pt-BR').replace(/(^|[\s'-])([a-z\u00e0-\u00f6\u00f8-\u00ff])/g,function(_,sep,letter){return sep+letter.toLocaleUpperCase('pt-BR')})}

var IC={vol:'<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',swap:'<path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/>',reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',flag:'<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>',sliders:'<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',full:'<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',exitfull:'<path d="M8 3v5H3M21 8h-5V3M3 16h5v5M16 21v-5h5"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',ball:'<circle cx="12" cy="12" r="9"/><path d="M5.5 5.5c4 2.5 4 10.500 0 13M18.500 5.500c-4 2.500-4 10.500 0 13"/>'};
function ic(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
/* apito */
var ctx;
function whistle(){
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    var t=ctx.currentTime,d=1.4,g=ctx.createGain(),lfo=ctx.createOscillator(),lg=ctx.createGain(),comp=ctx.createDynamicsCompressor();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.8,t+.03);g.gain.setValueAtTime(.8,t+d-.08);g.gain.linearRampToValueAtTime(0,t+d);
    lfo.frequency.value=34;lg.gain.value=.35;lfo.connect(lg);lg.connect(g.gain);
    [2850,2960,5700].forEach(function(f,i){var o=ctx.createOscillator();o.type=i<2?'square':'sine';o.frequency.value=f;o.connect(g);o.start(t);o.stop(t+d)});
    g.connect(comp);comp.connect(ctx.destination);lfo.start(t);lfo.stop(t+d);
    if(navigator.vibrate)navigator.vibrate(200);
  }catch(e){}
}

/* tela */
var previousRenderedScores={};
function render(){
  var m=document.getElementById('main');
  m.innerHTML=['A','B'].map(function(k){
    var s=S[k],tap=S.mode==='toque',score=String(show(k)),scoreChanged=previousRenderedScores[k]!==undefined&&previousRenderedScores[k]!==score;
    previousRenderedScores[k]=score;
    return '<section class="p '+k+(S.done&&S.win===k?' win':'')+'" data-k="'+k+'" style="order:'+((k==='A')!==S.flip?1:2)+'">'+
      '<button class="n" data-act="name" aria-label="Editar nome de '+esc(s.name)+'">'+ic('edit')+esc(s.name)+'</button>'+
      '<div class="s'+(scoreChanged?' score-changed':'')+'" aria-live="polite">'+score+'</div>'+(bt()?'<div class="sub">Games '+s.games+' · Sets '+s.sets+'</div>':'')+
      '<div class="ctl">'+(tap?'<button class="big" data-act="dec" aria-label="Diminuir ponto">−</button><span class="hint">Toque na cor para somar</span>':
        '<button class="big" data-act="dec" aria-label="Diminuir ponto">−</button><button class="big" data-act="inc" aria-label="Aumentar ponto">+</button>')+'</div>'+
      '<div class="ctl">'+
        (bt()?'':'<span class="mini">Sets <button data-act="sdec" aria-label="Diminuir set">−</button><span class="c">'+s.sets+'</span><button data-act="sinc" aria-label="Aumentar set">+</button></span>')+
        '<span class="mini"><button data-act="y"><i class="cd y"></i>'+s.y+'</button><button data-act="r"><i class="cd r"></i>'+s.r+'</button><button data-act="cz" aria-label="Zerar cartões">Zerar cartões</button></span>'+
      '</div></section>';
  }).join('');
  document.querySelectorAll('#mod button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===S.mod)});
  document.querySelectorAll('#mode button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===S.mode)});
  status();document.getElementById('rules').classList.remove('hide');
  save();
}
document.getElementById('main').addEventListener('click',function(e){
  var p=e.target.closest('.p');if(!p)return;
  var s=S[p.dataset.k],b=e.target.closest('button'),a=b&&b.dataset.act;
  if(!b){if(S.mode==='toque')add(p.dataset.k);return}
  if(a==='name')return editName(p.dataset.k);
  if(a==='inc'){add(p.dataset.k);return}
  if(a==='dec'){sub1(p.dataset.k);return}
  if(a==='sinc')s.sets++;
  if(a==='sdec')s.sets=Math.max(0,s.sets-1);
  if(a==='y')s.y++;
  if(a==='r')s.r++;
  if(a==='cz'){s.y=0;s.r=0}
  render();
});

/* beach tennis: 15/30/40, games, sets, tie-break */
var FM={set6:{name:'Set único até 6',n:6,sets:1,d:'Primeiro a 6 games com 2 de diferença: 5–5 vai a 7, 6–6 tie-break de 7 pontos.'},set8:{name:'Set único até 8 (finais)',n:8,sets:1,d:'Primeiro a 8 games: 7–7 vai a 9, 8–8 tie-break de 7 pontos.'},md3:{name:'Melhor de 3 sets',n:6,sets:3,d:'Sets de 6 games com tie-break em 6–6. Em 1–1 decide match tie-break de 10 pontos.'}};
function bt(){return S.mod==='beach'}
function vp(){return S.cfg.vp[S.mod]||(S.mod==='futevolei'?18:21)}
function chk(){if(bt())return;var T=vp(),a=S.A.pts,b=S.B.pts,w=a>=T&&a-b>=2?'A':b>=T&&b-a>=2?'B':null;S.done=!!w;S.win=w}
function show(k){var a=S[k].pts,b=S[k==='A'?'B':'A'].pts;if(!bt()||S.tb||S.mtb)return a;if(!S.cfg.nad&&a>=3&&b>=3)return a>b?'AD':40;return [0,15,30,40][Math.min(a,3)]}
function snap(){S.undo.push(JSON.stringify({A:S.A,B:S.B,tb:S.tb,mtb:S.mtb,done:!!S.done,win:S.win||null,hs:S.hs}));if(S.undo.length>40)S.undo.shift()}
function fin(k){S.done=true;S.win=k;whistle()}
function setWon(k){var F=FM[S.cfg.fmt],odd=(S.A.games+S.B.games)%2===1;S.hs.push(S.A.games+'–'+S.B.games);S[k].sets++;S.tb=false;S.A.pts=0;S.B.pts=0;
  if(S[k].sets>=(F.sets===1?1:2)){fin(k);return}
  S.A.games=0;S.B.games=0;
  if(S.A.sets===1&&S.B.sets===1){S.mtb=true;S.alert=(odd?'Trocar de lado · ':'')+'Match tie-break até 10'}else S.alert=(odd?'Trocar de lado · ':'')+'Novo set'}
function add(k){
  if(!bt()){if(S.done)return;var a0=S[k],b0=S[k==='A'?'B':'A'];a0.pts++;S.alert='';chk();if(S.done)whistle();else if(a0.pts===b0.pts&&a0.pts>=vp()-1)S.alert='Empate em '+a0.pts+': vence quem abrir 2 pontos';render();return}
  if(S.done)return;
  snap();S.alert='';
  var o=k==='A'?'B':'A',a=S[k],b=S[o],c=S.cfg,N=FM[c.fmt].n;
  a.pts++;
  if(S.tb||S.mtb){
    var lim=S.mtb?10:7;
    if(a.pts>=lim&&a.pts-b.pts>=2){
      if(S.mtb){S.hs.push('MTB '+a.pts+'–'+b.pts);a.sets++;fin(k)}else{a.games++;setWon(k)}
    }else if((a.pts+b.pts)%6===0)S.alert='Trocar de lado';
  }else if(c.nad?a.pts>=4:(a.pts>=4&&a.pts-b.pts>=2)){
    a.games++;a.pts=0;b.pts=0;
    if(a.games>=N&&a.games-b.games>=2)setWon(k);
    else{
      if(a.games===N&&b.games===N){S.tb=true;S.alert='Tie-break até 7 pontos, 2 de diferença'}
      else if((a.games+b.games)%2===1)S.alert='Trocar de lado';
    }
  }
  render();
}
function sub1(k){
  if(!bt()){S[k].pts=Math.max(0,S[k].pts-1);S.alert='';chk();render();return}
  var x=S.undo.pop();if(x){Object.assign(S,JSON.parse(x));S.alert=''}
  render();
}
function status(){
  var el=document.getElementById('st');
  if(!bt()){var currentVp=vp(),t0='Partida de '+currentVp+' pontos · empate no limite vai a 2 de diferença';if(S.done)t0='Fim de jogo: '+S[S.win].name+' venceu · '+S.A.pts+'–'+S.B.pts;var selector='<div class="score-limit" role="group" aria-label="Pontos para vencer"><span class="score-limit-label">Meta</span>'+[18,21].map(function(n){return '<button type="button" data-vp="'+n+'" aria-pressed="'+(currentVp===n)+'" aria-label="Partida até '+n+' pontos">'+n+'</button>'}).join('')+'</div>';el.innerHTML='<span>'+esc(t0)+'</span>'+selector+(S.alert?'<b class="al">'+ic('flag')+esc(S.alert)+'</b>':'');el.classList.remove('hide');return}
  var c=S.cfg,t=FM[c.fmt].name+' · '+(c.nad?'Ponto de ouro em 40–40':'Vantagem em 40–40');
  if(S.mtb)t+=' · Match tie-break (10)';else if(S.tb)t+=' · Tie-break (7)';
  if(S.hs.length)t+=' · Parciais: '+S.hs.join(', ');
  if(S.done)t='Fim de jogo: '+S[S.win].name+' venceu · '+S.hs.join(', ');
  el.innerHTML='<span>'+esc(t)+'</span>'+(S.alert?'<b class="al">'+ic('swap')+esc(S.alert)+'</b>':'');
  el.classList.remove('hide');
}
document.getElementById('st').addEventListener('click',function(e){var b=e.target.closest('button[data-vp]');if(!b)return;var target=Number(b.dataset.vp);if(target!==18&&target!==21)return;S.cfg.vp[S.mod]=target;S.alert='';chk();render()});
function fresh(){['A','B'].forEach(function(k){var n=S[k].name;S[k]=T(n)});S.tb=false;S.mtb=false;S.done=false;S.win=null;S.hs=[];S.undo=[];S.alert=''}
/* diálogos */
var dlg=document.getElementById('dlg');
function open(html,okTxt,onOk,cancelTxt){
  dlg.classList.remove('profile-edit-dialog');
  dlg.innerHTML=html+'<div class="row">'+(cancelTxt!==false?'<button id="dc">'+(cancelTxt||'Cancelar')+'</button>':'')+(okTxt?'<button id="dok" class="go">'+okTxt+'</button>':'')+'</div>';
  var ok=dlg.querySelector('#dok'),c=dlg.querySelector('#dc');
  if(c)c.onclick=function(){dlg.close()};
  if(ok){ok.style.cssText='background:var(--ink);color:var(--bg)';ok.onclick=function(){if(onOk&&onOk()===false)return;dlg.close()}}
  dlg.showModal();
}
function editName(k){
  open('<h2>Nome da dupla</h2><input id="nm" maxlength="30" value="'+esc(S[k].name)+'" aria-label="Nome da dupla">','Salvar',function(){
    var v=document.getElementById('nm').value.trim();if(!v)return false;S[k].name=personName(v);render()});
  var i=document.getElementById('nm');i.focus();i.select();
  i.onkeydown=function(e){if(e.key==='Enter')document.getElementById('dok').click()};
}
document.getElementById('reset').onclick=function(){
  open('<h2>Zerar placar?</h2><p>Pontos, sets e cartões voltam para 0. Nada vai para o histórico.</p>','Zerar',function(){fresh();render()});
};
document.getElementById('end').onclick=function(){
  var a=S.A,b=S.B;
  open('<h2>Terminar partida?</h2><p>'+esc(a.name)+' '+(bt()?a.sets+' × '+b.sets+(S.hs.length?' ('+S.hs.join(', ')+')':''):a.pts+' × '+b.pts)+' '+esc(b.name)+'</p><p class="hint">A partida será salva no histórico e o placar volta para 0.</p>','Terminar e salvar',function(){
    var h=ld(HKEY,[]);
    h.unshift({id:Date.now(),at:new Date().toISOString(),mod:S.mod,A:JSON.parse(JSON.stringify(a)),B:JSON.parse(JSON.stringify(b)),hs:S.hs.slice()});
    sv(HKEY,h);whistle();
    fresh();render();
  });
};
document.getElementById('hist').onclick=showAthleteHistory;
document.getElementById('whistle').onclick=whistle;
document.getElementById('flip').onclick=function(){S.flip=!S.flip;render()};

/* modalidade, modo, tema, tela cheia */
document.getElementById('mod').onclick=function(e){var b=e.target.closest('button');if(b){S.mod=b.dataset.v;S.alert='';if(bt())S.done=false;else chk();render()}};
document.getElementById('mode').onclick=function(e){var b=e.target.closest('button');if(b){S.mode=b.dataset.v;render()}};
function dark(){return S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function applyTheme(){document.documentElement.setAttribute('data-theme',dark()?'dark':'light');document.getElementById('theme').innerHTML=ic(dark()?'sun':'moon')+'<span>Tema</span>'}
document.getElementById('theme').onclick=function(){S.theme=dark()?'light':'dark';applyTheme();save()};
var fb=document.getElementById('full');
var scoreFull=document.getElementById('scoreFull');
function syncFullscreenControls(){
  var isFullscreen=!!document.fullscreenElement;
  var main=document.getElementById('main'),header=document.querySelector('header');
  if(isFullscreen)main.appendChild(scoreFull);
  else header.insertBefore(scoreFull,document.getElementById('menu'));
  [fb,scoreFull].forEach(function(button){
    button.querySelector('span').textContent=isFullscreen?'Voltar ao normal':'Maximizar tela';
    button.setAttribute('aria-label',isFullscreen?'Voltar ao normal':'Maximizar tela do placar');
    button.dataset.i=isFullscreen?'exitfull':'full';
    var icon=button.querySelector('svg');
    if(icon)icon.innerHTML=IC[button.dataset.i];
  });
}
async function toggleFullscreen(){
  if(document.fullscreenElement)await document.exitFullscreen();
  else await document.documentElement.requestFullscreen();
}
function bindFullscreenButton(button){
  button.onclick=function(){
    toggleFullscreen().catch(function(error){
      console.error('Unable to change fullscreen mode',error);
      var status=document.getElementById('st');
      status.textContent='Não foi possível alterar o modo de tela cheia. Verifique as permissões do navegador.';
      status.classList.remove('hide');
    });
  };
}
if(document.fullscreenEnabled){
  fb.classList.remove('hide');
  scoreFull.classList.remove('hide');
  bindFullscreenButton(fb);
  bindFullscreenButton(scoreFull);
  document.addEventListener('fullscreenchange',syncFullscreenControls);
  syncFullscreenControls();
}
document.querySelectorAll('[data-i]').forEach(function(b){b.insertAdjacentHTML('afterbegin',ic(b.dataset.i))});
document.getElementById('rules').onclick=function(){
  var c=S.cfg;
  if(!bt()){var m=S.mod,v=vp();
